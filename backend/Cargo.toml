[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "macros", "migrate"] }
dotenvy = "0.15.7"
validator = { version = "0.19", features = ["derive"] }
bcrypt = "0.15"
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors"] }
