services:
  postgres:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://todo:todo@postgres:5432/todo
      HOST: 0.0.0.0
      PORT: "3000"
      JWT_SECRET: "change-me-in-production"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "3001:3000"
    environment:
      # NEXT_PUBLIC_ プレフィックスでブラウザにも環境変数が渡される
      # ブラウザからは localhost:3000 でバックエンドにアクセスする
      NEXT_PUBLIC_API_URL: http://localhost:3000
    volumes:
      # ホスト側のソースコードをコンテナにマウント（ホットリロード用）
      - ./frontend:/app
      # node_modules はコンテナ内のものを使う（上書きしない）
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  todo_pgdata:
